# The server-side counterpart of dev/hooks/pre-commit: fails when a skill's scripts/_shared/ copy
# doesn't match shared/. Tests and the other checks run locally (make package).
name: Check

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check-sync
